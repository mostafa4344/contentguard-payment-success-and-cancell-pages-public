<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful – ContentGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D1117;
      color: #E6EDF3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #161B22;
      border: 1px solid #2EA043;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      background: rgba(46,160,67,0.15);
      border: 2px solid #2EA043;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    p  { font-size: 14px; color: #8B949E; line-height: 1.6; margin-bottom: 8px; }
    .invoice {
      background: #0D1117;
      border: 1px solid #30363D;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #8B949E;
      margin: 16px 0 24px;
      word-break: break-all;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: #2EA043;
      color: #fff;
    }
    .btn-secondary {
      background: transparent;
      color: #8B949E;
      border: 1px solid #30363D;
      font-size: 14px;
    }
    .status {
      font-size: 12px;
      color: #484F58;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Payment Successful!</h1>
    <p>Your ContentGuard Premium subscription is being activated.</p>
    <p>Tap the button below to return to the app.</p>
    <div class="invoice" id="invoice-box">Retrieving invoice ID...</div>
    <a class="btn btn-primary" id="open-app-btn" href="#">
      🚀 Open ContentGuard App
    </a>
    <a class="btn btn-secondary" href="https://contentguard.paymently.io">
      Back to Website
    </a>
    <p class="status" id="status-text">Redirecting to app automatically...</p>
  </div>

  <script>
    // Extract invoice_id from URL query params
    const params = new URLSearchParams(window.location.search);
    const invoiceId = params.get('invoice_id') || '';

    // Update invoice display
    const invoiceBox = document.getElementById('invoice-box');
    if (invoiceId) {
      invoiceBox.textContent = 'Invoice: ' + invoiceId;
    } else {
      invoiceBox.textContent = 'Invoice ID not found in URL';
      invoiceBox.style.color = '#DA3633';
    }

    // Build deep link with invoice_id
    const deepLink = invoiceId
      ? 'io.supabase.contentguard://payment-callback?invoice_id=' + encodeURIComponent(invoiceId)
      : 'io.supabase.contentguard://payment-callback';

    // Set button href
    document.getElementById('open-app-btn').href = deepLink;

    // Auto-redirect after 1.5 seconds
    let attempts = 0;
    function tryRedirect() {
      attempts++;
      document.getElementById('status-text').textContent =
        'Auto-redirecting... (attempt ' + attempts + ')';

      // Try to open the app via deep link
      window.location.href = deepLink;

      // If still here after 2s, try again once more
      if (attempts < 2) {
        setTimeout(tryRedirect, 2000);
      } else {
        document.getElementById('status-text').textContent =
          'Tap "Open ContentGuard App" if not redirected automatically.';
      }
    }

    // Start auto-redirect after short delay
    setTimeout(tryRedirect, 1500);
  </script>
</body>
</html>
