<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Payment Successful – ContentGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0D1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      background: #1a3a1a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #2EA043; }
    .subtitle { color: #8B949E; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: block;
      background: #2EA043;
      color: #fff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .btn:hover { background: #3fb950; }
    .btn.secondary {
      background: transparent;
      border: 1px solid #30363D;
      color: #8B949E;
      font-size: 14px;
    }
    .invoice {
      background: #0D1117;
      border: 1px solid #21262D;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #8B949E;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .status {
      display: inline-block;
      background: #1a3a1a;
      color: #2EA043;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    #countdown { color: #8B949E; font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <div class="status">Payment Verified</div>
  <h1>Payment Successful!</h1>
  <p class="subtitle">
    Your ContentGuard Premium is being activated.<br>
    Return to the app to complete activation.
  </p>

  <div class="invoice" id="invoice-box" style="display:none">
    Invoice ID: <strong id="invoice-id"></strong>
  </div>

  <a href="#" class="btn" id="open-app-btn">
    🚀 Open ContentGuard App
  </a>
  <a href="https://contentguard.paymently.io" class="btn secondary">
    Go to Homepage
  </a>

  <div id="countdown"></div>
</div>

<script>
  // Get invoice_id from URL query params
  const params = new URLSearchParams(window.location.search);
  const invoiceId = params.get('invoice_id') || params.get('invoice') || '';

  // Show invoice ID
  if (invoiceId) {
    document.getElementById('invoice-id').textContent = invoiceId;
    document.getElementById('invoice-box').style.display = 'block';
  }

  // Build deeplink: io.supabase.contentguard://payment-callback?invoice_id=XXX
  const deeplink = invoiceId
    ? 'io.supabase.contentguard://payment-callback?invoice_id=' + encodeURIComponent(invoiceId)
    : 'io.supabase.contentguard://payment-callback';

  // Set button href
  document.getElementById('open-app-btn').href = deeplink;

  // Auto-redirect to app after 2 seconds
  let seconds = 2;
  const countEl = document.getElementById('countdown');

  function tryOpenApp() {
    window.location.href = deeplink;
  }

  // Try to open app immediately
  setTimeout(tryOpenApp, 500);

  // Countdown display
  const timer = setInterval(() => {
    countEl.textContent = 'Auto-opening app in ' + seconds + 's...';
    if (seconds <= 0) {
      clearInterval(timer);
      countEl.textContent = 'Tap the button above if app did not open.';
      tryOpenApp();
    }
    seconds--;
  }, 1000);
</script>
</body>
</html>
