<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled – ContentGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0D1117; color: #fff;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #161B22; border: 1px solid #30363D;
      border-radius: 20px; padding: 40px 32px;
      max-width: 420px; width: 100%; text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #f85149; }
    .subtitle { color: #8B949E; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: block; background: #2EA043; color: #fff;
      text-decoration: none; padding: 15px 24px;
      border-radius: 12px; font-size: 16px; font-weight: 600; margin-bottom: 12px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">❌</div>
  <h1>Payment Cancelled</h1>
  <p class="subtitle">Your payment was cancelled.<br>No charges were made.</p>
  <a href="io.supabase.contentguard://payment-cancel" class="btn">
    ← Return to ContentGuard
  </a>
</div>
<script>
  setTimeout(() => {
    window.location.href = 'io.supabase.contentguard://payment-cancel';
  }, 1000);
</script>
</body>
</html>
